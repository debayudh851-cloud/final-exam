{% extends 'base.html' %}{% block content %}<section class="auth-card card"><div class="eyebrow">HR ACCESS</div><h1>Create your account</h1><p class="muted">Verify your email before accessing candidate information.</p>{% if errors %}<div class="alert error">{{ errors }}</div>{% endif %}<form method="post">{% csrf_token %}<p><label for="username">Username</label><input id="username" name="username" required maxlength="150" autocomplete="username"></p><p><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></p><p><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></p><button class="button">Create HR account</button></form></section>{% endblock %}
