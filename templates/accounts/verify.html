{% extends 'base.html' %}{% block content %}<section class="auth-card card"><div class="eyebrow">EMAIL VERIFICATION</div><h1>Confirm it’s you</h1><p class="muted">Enter the six-digit code sent to your email. It expires in 10 minutes.</p><form method="post">{% csrf_token %}<p><label for="email">Email</label><input id="email" name="email" type="email" required></p><p><label for="code">Verification code</label><input id="code" name="code" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" required autocomplete="one-time-code"></p><button class="button">Verify email</button></form></section>{% endblock %}
