  /api/screening/predict/:
    post:
      operationId: screening_predict_create
      tags:
      - screening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Predict'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Predict'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Predict'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Assign:
      type: object
      properties:
        candidate:
          type: integer
        slot:
          type: integer
      required:
      - candidate
      - slot
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/BatchStatusEnum'
        total_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        processed_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        accepted_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        rejected_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        error:
          type: string
        task_id:
          type: string
          maxLength: 100
        exports:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exports
      - id
    BatchStatusEnum:
      enum:
      - QUEUED
      - PROCESSING
      - COMPLETED
      - FAILED
      type: string
      description: |-
        * `QUEUED` - Queued
        * `PROCESSING` - Processing
        * `COMPLETED` - Completed
        * `FAILED` - Failed
    Candidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        candidate_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        college:
          type: string
          maxLength: 200
        applied_role:
          type: integer
        batch:
          type: integer
          readOnly: true
          nullable: true
        skills:
          type: string
        experience_months:
          type: integer
          maximum: 600
          minimum: 0
        notice_period_days:
          type: integer
          maximum: 365
          minimum: 0
        expected_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        resume_text:
          type: string
        portfolio_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        historical_selection_status:
          type: string
          maxLength: 15
        status:
          $ref: '#/components/schemas/CandidateStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applied_role
      - batch
      - candidate_name
      - created_at
      - email
      - expected_salary
      - experience_months
      - id
      - notice_period_days
      - phone
      - skills
      - updated_at
    CandidateStatusEnum:
      enum:
      - NEW
      - SHORTLISTED
      - INTERVIEW
      - SELECTED
      - WAITLISTED
      - REJECTED
      type: string
      description: |-
        * `NEW` - New
        * `SHORTLISTED` - Shortlisted
        * `INTERVIEW` - Interview
        * `SELECTED` - Selected
        * `WAITLISTED` - Waitlisted
        * `REJECTED` - Rejected
    Feedback:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slot:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comments:
          type: string
        recommendation:
          $ref: '#/components/schemas/RecommendationEnum'
        submitted_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comments
      - created_at
      - id
      - rating
      - recommendation
      - slot
      - submitted_by
    JobRole:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_-]{1,19}$
          maxLength: 20
        required_skills: {}
        min_experience_months:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_notice_period_days:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - code
      - id
      - name
      - url
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    NLP:
      type: object
      properties:
        resume_text:
          type: string
          maxLength: 30000
        role:
          type: integer
      required:
      - resume_text
      - role
    PaginatedCandidateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
    PaginatedFeedbackList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
    PaginatedJobRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobRole'
    PaginatedScreeningList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Screening'
    PaginatedSlotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    PatchedCandidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        candidate_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        college:
          type: string
          maxLength: 200
        applied_role:
          type: integer
        batch:
          type: integer
          readOnly: true
          nullable: true
        skills:
          type: string
        experience_months:
          type: integer
          maximum: 600
          minimum: 0
        notice_period_days:
          type: integer
          maximum: 365
          minimum: 0
        expected_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        resume_text:
          type: string
        portfolio_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        historical_selection_status:
          type: string
          maxLength: 15
        status:
          $ref: '#/components/schemas/CandidateStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Predict:
      type: object
      properties:
        experience_months:
          type: integer
          maximum: 600
          minimum: 0
        notice_period_days:
          type: integer
          maximum: 365
          minimum: 0
        expected_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        skills:
          type: string
          maxLength: 2000
        applied_role:
          type: string
          maxLength: 100
      required:
      - applied_role
      - expected_salary
      - experience_months
      - notice_period_days
      - skills
    RecommendationEnum:
      enum:
      - SELECTED
      - WAITLISTED
      - REJECTED
      type: string
      description: |-
        * `SELECTED` - Selected
        * `WAITLISTED` - Waitlisted
        * `REJECTED` - Rejected
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    Screening:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rule_passed:
          type: boolean
        rule_reasons: {}
        ml_probability:
          type: number
          format: double
          nullable: true
        keyword_score:
          type: number
          format: double
        matched_skills: {}
        pos_tags: {}
        model_version:
          type: string
          maxLength: 100
        updated_at:
          type: string
          format: date-time
          readOnly: true
        candidate:
          type: integer
      required:
      - candidate
      - id
      - updated_at
    Slot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: integer
        candidate:
          type: integer
          nullable: true
        interviewer:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 200
      required:
      - ends_at
      - id
      - interviewer
      - role
      - starts_at
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Upload:
      type: object
      properties:
        file:
          type: string
          format: uri
        background:
          type: boolean
          default: false
      required:
      - file
    VerifiedToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Verify:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
