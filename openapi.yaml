      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
  /api/interview-slots/create/:
    post:
      operationId: interview_slots_create_create
      tags:
      - interview-slots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Slot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Slot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Slot'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
  /api/interviews/assign/:
    post:
      operationId: interviews_assign_create
      tags:
      - interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assign'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/roles/:
    get:
      operationId: roles_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobRoleList'
          description: ''
  /api/roles/{id}/:
    get:
      operationId: roles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job role.
        required: true
      tags:
      - roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRole'
          description: ''
  /api/screening-results/:
    get:
      operationId: screening_results_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - screening-results
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScreeningList'
          description: ''
  /api/screening/nlp/:
    post:
      operationId: screening_nlp_create
      tags:
      - screening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NLP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NLP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NLP'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
